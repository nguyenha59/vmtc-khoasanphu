  # chóng mặt = Vàng. Không dùng từ đơn dễ nhầm ("xỉu" ≈ "xíu" khi không dấu, "hồi hộp" = lo lắng, "căng tức ngực" = vú).
  CONVULSION: {name: "Co giật", meaning: "co giật, lên cơn giật tay chân, sùi bọt mép, mất ý thức kèm giật (S1)", level: red, past_counts_yellow: true,
               synonyms: ["co giật", "lên cơn giật", "giật tay chân", "sùi bọt mép", "lên cơn động kinh",
                          "co giat", "len con giat", "giat tay chan", "sui bot mep", "len con dong kinh", "co quắp", "co quap"]}
  SYNCOPE: {name: "Ngất / xỉu", meaning: "ngất, xỉu, bất tỉnh, mất ý thức trong chốc lát (S2, S3)", level: red, past_counts_yellow: true,
            synonyms: ["ngất", "ngất xỉu", "bị xỉu", "xỉu đi", "xỉu xuống", "bất tỉnh", "lịm đi",
                       "ngat xiu", "bi xiu", "xiu di", "xiu xuong", "bat tinh", "lim di"]}
  CHEST_PAIN: {name: "Đau ngực / tim đập nhanh", meaning: "đau, tức, thắt ở ngực (không phải vú căng), tim đập nhanh / mạnh, đánh trống ngực (S2, S3)", level: red,
               synonyms: ["đau ngực", "tức ngực", "đau thắt ngực", "tim đập nhanh", "tim đập mạnh", "đánh trống ngực",
                          "dau nguc", "tuc nguc", "dau that nguc", "tim dap nhanh", "tim dap manh", "danh trong nguc"]}
  DIZZINESS: {name: "Chóng mặt", meaning: "chóng mặt, choáng váng, xây xẩm, tối sầm mặt mũi nhưng không ngất (S2, S3)", level: yellow,
              synonyms: ["chóng mặt", "choáng váng", "xây xẩm", "tối sầm mặt mũi", "tối sầm mắt",
                         "chong mat", "choang vang", "xay xam", "toi sam mat mui", "toi sam mat"]}
  SELF_HARM: {name: "Ý nghĩ tự hại", meaning: "ý nghĩ tự hại hoặc không muốn sống – kể cả nói gián tiếp, sống vô nghĩa, muốn kết thúc (S1, S2)", level: red, locked: true, negation_allowed: false, past_counts_yellow: true,
              synonyms: ["muốn biến mất", "không muốn sống", "muốn chết", "tự tử", "chẳng thiết sống", "không thiết sống",
                         "tự làm hại", "ngủ luôn không dậy", "tốt hơn nếu không có em", "tốt hơn nếu không có mình",
                         "muon bien mat", "khong muon song", "muon chet", "tu tu", "khong thiet song"]}

# Phương án A (người dùng chốt 11/11/2026): khi lớp danh mục CHẮC CHẮN triệu chứng là của người khác / đã hết,
# hoặc câu chỉ tả bé đạp bình thường, mà LLM vẫn ra ĐỎ → hạ finding đó còn tối đa cap_level (không bao giờ về xanh).
# Không áp dụng cho khái niệm locked (SELF_HARM). Không đụng luật khóa combine (mức quy tắc form vẫn giữ nguyên).
# [CẦN XÁC NHẬN] bác sĩ duyệt danh sách cụm từ.
form_cap:
  enabled: true
  cap_level: yellow
  # Người dùng chọn 15/11/2026: Đỏ do CHỈ AI thấy (lớp danh mục không thấy từ khóa nào của khái niệm đó trong câu)
  # → Vàng + "AI nghi ngờ – gọi xác minh". Vd "mắt em hơi mỏi" bị AI đọc thành Rối loạn thị giác.
  # Không áp dụng cho khái niệm khóa (SELF_HARM luôn Đỏ). Không đụng mức của câu có cấu trúc.
  ai_only_red_cap: true
  # Ngoại lệ của ai_only_red_cap (15/11/2026, MẶC ĐỊNH TẮT – chờ bác sĩ quyết): giữ ĐỎ dù danh mục không có từ khóa khi
  # HAI bộ đọc độc lập cùng xác nhận: AI (mọi lần chạy cùng thấy, trích dẫn có thật) + bộ đọc theo nghĩa `semantic`.
  # Lý do: danh mục từ khóa không bao giờ đủ – bộ đo indep_v1: 18/21 ca đỏ bị hạ vàng là do ai_only_red_cap.
  # Đo (docs/05 mục 3): bật → độ nhạy đỏ 39/62 → 51/62, báo nhầm không tăng (12 → 12), 0 ca giữ đỏ nhầm.
  ai_only_red_keep:
    enabled: false
    concepts: [BLEEDING, REDUCED_FM, FLUID, DYSPNEA, SYNCOPE, CONVULSION, VISUAL, EPIGASTRIC, CHEST_PAIN, CALF,
               CONTRACTIONS]
    require_unanimous: true
    require_semantic: true
  # Có các cụm này → thai phụ có thể cũng bị / đang kể lại triệu chứng của mình → không hạ.
  keep_red_markers: ["em cũng", "cả em", "mình cũng", "tôi cũng", "giống em", "bảo em", "nói em", "thấy em",
                     "em cung", "ca em", "minh cung", "toi cung", "giong em", "bao em", "noi em", "thay em"]
  # Câu tả bé đạp bình thường; chỉ dùng để hạ REDUCED_FM / CONTRACTIONS khi danh mục không thấy khái niệm đó.
  normal_fm_concepts: [REDUCED_FM, CONTRACTIONS]
  normal_fm_phrases: ["đạp nhiều", "đạp đều", "đạp mạnh", "đạp liên tục", "đạp bình thường", "máy đều", "máy nhiều",
                      "dap nhieu", "dap deu", "dap manh", "dap lien tuc", "dap binh thuong", "may deu", "may nhieu"]
  # Mối lo ngoài danh mục bị bỏ nếu chỉ là câu bình thường: cụm "bình thường" chiếm gần hết mối lo
  # (còn lại tối đa max_leftover_tokens từ), hoặc mệnh đề gốc là đọc/nghe thông tin chứ không phải triệu chứng.
  # Mệnh đề có các từ này (diễn biến thay đổi / giảm) → không coi là "bé đạp bình thường".
  normal_fm_breakers: ["rồi", "nhưng", "sau đó", "tự nhiên", "bỗng", "giờ", "ít", "giảm", "yếu", "im", "không", "chưa",
                       "roi", "nhung", "sau do", "tu nhien", "bong", "gio", "giam", "yeu", "khong", "chua"]
  benign_concern_phrases: ["đạp nhiều", "đạp đều", "đạp mạnh", "đạp liên tục", "đạp bình thường", "khỏi rồi",
                           "đỡ rồi", "hết rồi", "vẫn khỏe", "vẫn bình thường", "dap nhieu", "dap deu", "dap manh",
                           "dap lien tuc", "khoi roi", "do roi", "het roi", "van khoe", "van binh thuong"]
  max_leftover_tokens: 1
  info_context_phrases: ["đọc trên mạng", "trên mạng", "đọc báo", "xem trên mạng", "doc tren mang", "tren mang",
                         "doc bao"]

# Lưới dự phòng khi AI không chạy (15/11/2026): nhận "người khác bị" theo cấu trúc câu
# [người thân] (+ của / thân / ruột…) + [tôi / em / mình] + (bị) + triệu chứng, không liệt kê từng cụm.
# Viết có dấu; code tự sinh dạng không dấu. Chỉ áp dụng khi người thân đứng LIỀN triệu chứng (chen tối đa vài từ nối).
# [CẦN XÁC NHẬN] bác sĩ duyệt danh sách.
experiencer:
  # Đứng một mình đã chắc là người khác ("chồng bị sốt", "mẹ chồng bị cao huyết áp").
  relatives_standalone: ["mẹ chồng", "bố chồng", "chị gái", "em gái", "em trai", "anh trai", "anh rể", "em rể",
                         "chị dâu", "em dâu", "chị họ", "em họ", "anh họ", "con lớn", "bé lớn", "con gái", "con trai",
                         "ông nội", "ông ngoại", "bà nội", "bà ngoại", "hàng xóm", "đồng nghiệp", "chồng", "bố", "mẹ"]
  # Phải có chủ sở hữu ("bạn của tôi", "anh tôi", "dì em", "bạn thân mình") – đứng một mình dễ là xưng hô
  # ("chị bị ra máu" có thể là thai phụ tự xưng). Không có "con", "bé", "em bé": dễ là thai nhi.
  relatives_need_owner: ["bạn thân", "bạn gái", "bạn", "ba", "má", "anh", "chị", "cô", "dì", "chú", "bác", "cậu",
                         "mợ", "thím", "ông", "bà"]
  owner_words: ["tôi", "em", "mình"]
  # Không có "cả": "chồng CẢ em bị ra máu" = cả hai cùng bị, không phải "chồng của em".
  owner_modifiers: ["của", "thân", "ruột", "họ", "lớn", "nhỏ", "út"]
  # Viết không dấu thì trùng từ khác ("ma" = mà, "chi" = chỉ, "co" = có, "di" = đi) → chỉ nhận khi viết có dấu.
  ambiguous_plain: ["má", "chị", "cô", "dì"]

# AI được hạ mức phần tự viết (người dùng chốt 15/11/2026, thay luật cũ "AI chỉ nâng" cho riêng phần tự viết):
# danh mục thấy triệu chứng của thai phụ nhưng AI đọc ra người khác / đã hết / phủ định ở CÙNG chỗ trong câu.
# Vàng → Xanh được; Đỏ → tối đa `floor_if_red` (không bao giờ Đỏ → Xanh). Không áp dụng cho câu trả lời có cấu trúc,
# khái niệm khóa (SELF_HARM) và `exclude_concepts`. AI lỗi / không đủ phiếu → giữ mức danh mục.
# [CẦN XÁC NHẬN] bác sĩ duyệt.
ai_override:
  enabled: true
  reasons: [other_person, past_resolved, negated]
  min_vote_share: 1.0                      # tỷ lệ lần chạy AI cùng đọc ra "không có hiệu lực" (1.0 = mọi lần)
  min_confidence: 0.8                      # độ nhất quán chung của các lần chạy
  floor_if_red: yellow
  exclude_concepts: [REDUCED_FM, CONTRACTIONS]   # thai nhi dễ bị AI coi là "người khác"
  # Câu gốc phải có dấu hiệu cho cách đọc của AI (chống AI đọc sai "sáng nay ra máu" thành "không ra máu").
  # negated: trong CÙNG mệnh đề với triệu chứng; past_resolved: mệnh đề đó hoặc mệnh đề ngay sau;
  # other_person: ngay trước triệu chứng (cùng mệnh đề) là một TỪ CHỈ NGƯỜI (`person_words`); chen giữa chỉ được từ nối
  # (`not_subject_words`), từ nối danh xưng (`person_continuation`: nhà, xã, của…) và đại từ sở hữu liền sau
  # ("cháu EM bị", "bạn của TÔI"). "mẹ em lo vì em ra máu", "leo cầu thang là hụt hơi" → không đủ dấu hiệu.
  support:
    person_words: ["người", "ông", "bà", "anh", "chị", "cô", "chú", "bác", "dì", "cậu", "mợ", "thím", "bạn", "con",
                   "cháu", "chồng", "vợ", "bố", "ba", "mẹ", "má", "em gái", "em trai", "hàng xóm", "đồng nghiệp",
                   "đứa", "thằng", "cu", "nhỏ", "giáo"]
    person_continuation: ["nhà", "xã", "của", "lớn", "nhỏ", "gái", "trai", "họ", "thân", "ruột", "út", "cả",
                          "nội", "ngoại", "chồng", "vợ", "dâu", "rể", "cùng", "phòng", "giáo"]
    # Văn bản có dấu: khớp ĐÚNG DẤU. Không dấu: bỏ các từ trùng từ khác ("đâu"=đau, "đỡ"=đỏ, "hồi"=hơi, "đã"=da/dạ).
    plain_ambiguous: ["đâu", "đỡ", "hồi", "đã", "chả"]
    negated: ["không", "chưa", "chẳng", "chả", "ko", "hết", "đâu", "chưa từng", "không hề"]
    past_resolved: ["hôm qua", "hôm kia", "hôm trước", "tuần trước", "tháng trước", "lúc trước", "trước đây", "hồi",
                    "đã", "hết", "khỏi", "đỡ", "rồi"]
    not_subject_words: ["em", "tôi", "mình", "chị", "bị", "có", "thấy", "cũng", "đang", "hay", "thì", "lại", "vẫn",
                        "hơi", "rất", "khá", "sáng", "trưa", "chiều", "tối", "đêm", "nay", "qua", "hôm", "bây", "giờ",
                        "lúc", "hiện", "tại", "từ", "mấy", "ngày", "hai", "ba", "dạo", "này", "tự", "nhiên", "bỗng",
                        "và", "với", "nhưng", "mà", "còn", "nên", "vì", "do", "là", "ạ", "ơi", "bác", "sĩ"]

noshow:
  call_threshold: 0.5
  sms_threshold: 0.3
  priority_windows:
    - {label: "sàng lọc 11-13+6", ga_from: [11, 0], ga_to: [13, 6], keywords: ["độ mờ da gáy", "NT", "double test", "sàng lọc"]}
    - {label: "nghiệm pháp đường huyết 24-28", ga_from: [24, 0], ga_to: [28, 0], keywords: ["nghiệm pháp", "NPDN"]}
    - {label: "liên cầu B 35-37", ga_from: [35, 0], ga_to: [37, 0], keywords: ["liên cầu"]}

llm:
  provider: ollama                         # ollama | hybrid | mock | openai (API ngoài: CHỈ dữ liệu giả)
  model: "qwen2.5:7b-instruct"
  openai_model: "gpt-4.1-mini"             # OPENAI_MODEL trong .env ưu tiên hơn
  consistency_runs_note: 3            # 5 → 3 (17/11/2026): AI không còn tính số phút; ghi chú không có giờ chỉ 1 lần (economy_mode)
  consistency_runs_form: 3
  temperature: 0.7
  economy_mode: true
  summary_llm_rewrite: false
  assertion_conflict_penalty: 0.2
  timeout_seconds: 120
  # inherit = cùng chế độ với AI chính; rules = chỉ chấm theo quy tắc.
  # hybrid chỉ dùng OpenAI khi được phép; production hoặc không có key thì dùng Ollama.
  question_selector_provider: inherit

# Bộ đọc thứ hai theo NGHĨA (core/ai/reader/semantic.py): embedding cục bộ qua Ollama, so trích dẫn với tên + `meaning`
# của khái niệm (không dùng từ đồng nghĩa). Chỉ làm nhân chứng cho form_cap.ai_only_red_keep. Ngưỡng hiệu chỉnh trên
# bộ đã lộ (v1/v2 red-team, ood_v1, tests/redteam), đo trên bộ kín (indep_v1, ood_v2) – xem docs/05 mục 3.
semantic:
  enabled: true
  # ollama (mặc định, cục bộ) | hybrid / openai (API ngoài: CHỈ dữ liệu giả, SYNTHETIC_DATA_ONLY=1, cấm production)
  # | mock (chỉ test). SEMANTIC_PROVIDER trong .env ưu tiên hơn.
  provider: ollama
  # Mô hình Ollama (cục bộ – bắt buộc khi dùng thật); SEMANTIC_MODEL trong .env ưu tiên hơn.
  # So sánh 15/11/2026 (bộ kín 81 ca đỏ): qwen3-embedding:4b 66/81 nhầm 0,3% · bge-m3 61/81 0,7% ·
  # snowflake-arctic-embed2 60/81 0,5% · embeddinggemma 49/81 · qwen3-embedding:0.6b 28/81 · OpenAI large 67/81 0,3%.
  model: "qwen3-embedding:4b"
  openai_model: "text-embedding-3-large"   # chỉ khi SEMANTIC_PROVIDER=hybrid/openai (dữ liệu giả)
  # Ngưỡng độ giống nghĩa theo mô hình (thang điểm mỗi mô hình khác nhau) – chọn bằng scripts/compare_embedders.py
  # trên bộ ĐÃ LỘ, điều kiện xác nhận nhầm chủ đề ≤ 0,5%. Mô hình không có trong bảng → `threshold`.
  thresholds: {"qwen3-embedding:4b": 0.49, "bge-m3": 0.53, "snowflake-arctic-embed2": 0.44,
               "text-embedding-3-large": 0.30}
  threshold: 0.6
  top_k: 1                                 # khái niệm AI chọn phải là khái niệm giống nghĩa NHẤT
  prototypes: {}                           # mẫu nghĩa bác sĩ thêm theo khái niệm (tùy chọn) – KHÔNG chép câu bộ đo

channels:
  sms: excel                               # excel | mock | test_api
  alert: mock                              # mock | teams_webhook
  yellow_digest_times: ["08:00", "14:00"]

retention_days: 30

# Thuộc tính từng khóa cho màn Cấu hình quy tắc (docs/04 F).
# group: arrival | forms | thresholds | channels ; basis: căn cứ hiển thị.
