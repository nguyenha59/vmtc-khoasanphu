# Cấu hình mặc định – MVP. Ngưỡng y khoa phải được bác sĩ duyệt trước khi dùng thật.
rules_version: "0.11.0"

departments_included: ["Phòng khám Sản phụ khoa"]   # [CẦN XÁC NHẬN tên khoa trong file HIS]

clinic:
  name: "Phòng khám Sản phụ khoa"
  hotline: "1900 0000"                      # [CẦN XÁC NHẬN số đường dây khoa]
  emergency_number: "115"

arrival:
  valid_hours: {from: "06:00", to: "20:00"}
  earliest_arrival: "06:30"
  max_minutes_early: 90
  ai_rule_diff_minutes: 15
  merge_conflict_minutes: 180
  # Đến sớm theo từng lịch (khoa xác nhận 12/11/2026): xét nghiệm 30', siêu âm 20', khám / dịch vụ khác 15'.
  # Mỗi lịch trong ngày tính riêng (giờ hẹn − số phút của lịch đó), lấy giờ sớm nhất.
  # in_note: true → từ khóa cũng được dò trong ghi chú của lịch (bác sĩ dặn làm XN).
  early_by_service:                       # editable, requires_doctor: false
    - {keywords: ["xét nghiệm", "XN", "lấy máu", "nhịn ăn", "nghiệm pháp", "NPDN", "đường huyết"], minutes: 30, in_note: true}
    - {keywords: ["siêu âm", "SA", "2D", "4D", "hình thái", "doppler", "độ mờ da gáy", "NT"], minutes: 20}
    - {keywords: ["*"], minutes: 15}
  call_note_keywords: ["gọi", "xác nhận", "hỏi lại", "chưa rõ", "đổi lịch", "dời lịch", "?"]
  fasting_keywords: ["nhịn ăn", "nghiệm pháp", "NPDN", "đường huyết", "xét nghiệm máu", "lấy máu"]   # [CẦN XÁC NHẬN]
  late_ga_weeks: 37
  # Chỉ gọi AI cho ghi chú mà quy tắc chưa hiểu hết (khoa chọn 12/11/2026). Ghi chú chỉ gồm các từ dưới đây
  # (so không dấu) + tuần thai / giờ / số phút → quy tắc đã đọc đủ, không gọi AI. Có từ lạ (vd "song thai",
  # "VMC cũ", "dọa sinh non") → vẫn gọi AI. Thêm từ vào đây = bớt gọi AI; thiếu từ chỉ làm gọi AI thừa (an toàn).
  ai_skip_vocabulary: [autobooking, thai, moi, ycbs, yc, bs, bac, si, kham, sieu, am, sa, xn, xet, nghiem, lay,
                       mau, nhin, an, npdn, nghiem, phap, den, toi, truoc, som, luc, co, mat, vao, phut, ph, p,
                       tieng, gio, h, g, ruoi, nua, mot, khoang, w, tuan, ngay, d, va, lam, de, dinh, ky, tai,
                       tk, tt, tuoi, hinh, theo, hen, dan, lich, doppler, phu, khoa, dk, 2d, 4d, nt, kq]
  ai_confidence_min: 0.8
  # Lịch hẹn trong khung này là "khám chờ" (giờ trên HIS không phải giờ thật) – khoa xác nhận 10/11/2026.
  # Không tính giờ đến; tin nhắn ghi nhãn thay cho giờ. Khung [from, to): 12:00 ≤ giờ hẹn < 13:00.
  waiting_slot: {from: "12:00", to: "13:00", label: "Khám chờ", mixed_review_minutes: 30}
  # Khám chờ là lịch sớm nhất nhưng khách còn lịch giờ thật muộn hơn "to" quá mixed_review_minutes
  # (vd khám chờ 12:00 + siêu âm 14:00) → giữ nhãn "Khám chờ", đưa vào Cần xác nhận (khoa 12/11/2026).   # [CẦN XÁC NHẬN lịch đúng 13:00 có phải khám chờ]

# Nội dung nhạy cảm trong ghi chú (12/11/2026). Gặp → hiện cảnh báo cho điều dưỡng (không trao đổi với
# người nhà, không ghi vào tin nhắn) và KHÔNG gửi ghi chú đó ra API bên ngoài (openai). So cả dạng không dấu.
# [CẦN XÁC NHẬN] khoa duyệt danh mục.
privacy:
  sensitive_topics:
    - {label: "Bệnh lây truyền", keywords: ["HIV", "giang mai", "lậu", "sùi mào gà", "viêm gan B", "viêm gan C",
                                             "HBsAg dương tính", "herpes sinh dục"]}
    - {label: "Đình chỉ / phá thai", keywords: ["đình chỉ thai", "phá thai", "hút thai", "bỏ thai",
                                                 "không giữ thai", "nạo thai"]}
    - {label: "Hỗ trợ sinh sản", keywords: ["IVF", "thụ tinh ống nghiệm", "mang thai hộ", "xin trứng",
                                             "xin tinh trùng", "IUI"]}
    - {label: "Bạo lực / xâm hại", keywords: ["bạo lực", "bị đánh", "chồng đánh", "xâm hại", "hiếp", "cưỡng bức"]}
    - {label: "Sức khỏe tâm thần", keywords: ["trầm cảm", "tự tử", "tự sát", "tâm thần", "rối loạn lo âu",
                                               "muốn chết"]}
    - {label: "Chất gây nghiện", keywords: ["ma túy", "nghiện", "cai nghiện", "methadone"]}
    - {label: "Yêu cầu giữ kín", keywords: ["giữ bí mật", "không muốn chồng biết", "không cho chồng biết",
                                             "giấu gia đình", "không báo người nhà", "giấu chồng", "bảo mật"]}

forms:
  # Ai được theo dõi từ xa (gửi form): package_only = chỉ khách theo gói thai sản + ca bác sĩ chỉ định ngoài gói
  # (người dùng chọn 12/11/2026). Tắt (false) = mọi thai phụ đã đồng ý.
  eligibility: {package_only: true}
  min_gap_days: 14
  skip_if_visit_within_days: 3
  stop_routine_from_ga_weeks: 36
  resend_block_days: 7
  token_ttl_days: 3
  windows:                                # tuần thai (tuần, ngày)
    F1: {from: [8, 0], to: [10, 6]}
    F2: {from: [14, 0], to: [16, 6]}
    F3: {from: [19, 0], to: [21, 6]}
    F4: {from: [24, 0], to: [26, 6]}
    F5: {from: [29, 0], to: [31, 6]}
    F6: {from: [33, 0], to: [35, 6]}
  modules:
    M-THA: {every_days: 1}
    M-DTD: {every_days: 3, every_days_if_insulin: 1}
  postpartum_days: {S1: 3, S2: 7, S3: 14, S4: 42}
  postpartum_grace_days: 2                 # quên xuất SMS đúng ngày → vẫn gửi bù thêm N ngày (docs/04 C7)
  no_reply_reminder_hours: 48

thresholds:                               # requires_doctor: true
  bp_yellow: {sys: 140, dia: 90}
  bp_red: {sys: 160, dia: 110}
  glucose_yellow: {fasting: 5.3, after_1h: 7.8, after_2h: 6.7}   # mmol/L, QĐ 1470/QĐ-BYT
  epds_threshold: 13                       # đề xuất 4 theo bản tiếng Việt (Tran và cs. 2011) – chờ duyệt
  epds_item10_red: {value: true, locked: true}
  implausible: {sys_min: 70, sys_max: 250, glu_min: 1, glu_max: 40}
  weight_jump_kg_per_week: null            # [CẦN XÁC NHẬN] khoa điền
  contractions_red_before_ga_weeks: 37
  contractions_level_at_term: yellow       # [CẦN XÁC NHẬN] gò bụng ≥ 37 tuần

trends:
  ewma_lambda: 0.3
  baseline_readings: 4
  sigma_k: 2
  consecutive_rises: 3
  min_rise_mmhg: 8
  min_readings: 3
  min_sigma: 3                             # sàn độ lệch chuẩn khi mức nền quá phẳng
  ewma_kinds: [bp_sys, bp_dia]

combine:
  ai_only_escalates: {value: true, locked: true}

# Ca đỏ bị điều dưỡng hạ mức (hạ vàng / báo nhầm) → danh sách bác sĩ xem lại trong ngày (docs/04 C6).
# [CẦN XÁC NHẬN] khoa duyệt. Bắt đầu 100%; giảm khi màn "Học từ kết quả gọi" cho thấy điều dưỡng hạ đúng.
alert_review:
  downgrade_sample_rate: 1.0               # 1.0 = xem tất cả; 0.2 = xem 1/5 (lấy mẫu ổn định theo mã cảnh báo)
  always_review_rule_codes: [C1, C8, EPDS_10]          # ra máu, thai máy giảm, EPDS câu 10 – luôn xem 100%
  always_review_concepts: [BLEEDING, REDUCED_FM, SELF_HARM]

# Danh mục khái niệm cho AI đọc phần tự viết (docs/05 mục 3). Từ đồng nghĩa có cả dạng không dấu.
# [CẦN XÁC NHẬN] bác sĩ duyệt danh mục và mức.
symptom_concepts:
  BLEEDING: {name: "Ra máu âm đạo", meaning: "máu hoặc dịch lẫn máu (đỏ, hồng, nâu) ra từ âm đạo – thấy trên quần lót, băng vệ sinh, giấy lau (S1, S2)", level: red, past_counts_yellow: true,
             synonyms: ["ra máu", "ra huyết", "thấy hồng", "chảy máu", "ra mau", "ra huyet", "thay hong", "chay mau", "máu cục", "mau cuc", "ra cục máu", "ra cuc mau", "rỉ máu", "ri mau", "thấm ướt băng", "tham uot bang", "ướt đẫm băng", "uot dam bang"]}
  REDUCED_FM: {name: "Giảm cử động thai", meaning: "thai cử động (đạp, cựa, máy, quẫy) ít hơn bình thường, yếu đi hoặc không thấy cử động (S2)", level: red, past_counts_yellow: true,
               synonyms: ["ít đạp", "con nằm im", "bé nằm im", "không thấy đạp", "thai máy giảm", "thai máy ít", "đạp ít", "nằm im", "it dap", "nam im", "khong thay dap", "thai may it", "con không đạp", "con khong dap", "bé không đạp", "be khong dap", "thai không máy", "thai khong may", "đạp yếu", "dap yeu"]}
  VISUAL: {name: "Rối loạn thị giác", meaning: "thay đổi thị lực: nhìn mờ, nhòe, lóa, thấy chấm sáng / đốm, nhìn một thành hai (S1, S2, S4)", level: red,
           synonyms: ["hoa mắt", "đom đóm mắt", "nhìn mờ", "mờ mắt", "hoa mat", "dom dom mat", "nhin mo", "mo mat", "nhìn nhòe", "nhin nhoe", "mắt nhòe", "mat nhoe", "lóa mắt", "loa mat", "nhìn đôi", "nhin doi", "nhìn không rõ", "nhin khong ro"]}
  EPIGASTRIC: {name: "Đau thượng vị", meaning: "đau vùng bụng trên giữa – dưới xương ức, trên rốn, vùng dạ dày – hoặc ngay dưới sườn phải (S2, S4)", level: red,
               synonyms: ["đau dưới ức", "đau chấn thủy", "đau thượng vị", "đau vùng thượng vị", "dau duoi uc", "dau chan thuy", "dau thuong vi", "đau dưới sườn", "dau duoi suon", "đau hạ sườn phải", "dau ha suon phai", "đau dưới xương sườn", "dau duoi xuong suon"]}
  HEADACHE: {name: "Đau đầu nhiều", meaning: "đau / nhức / căng / nặng ở đầu (trán, thái dương, gáy), nhất là không đỡ hoặc nặng dần (S1, S2, S4)", level: red,
             synonyms: ["đau đầu", "nhức đầu", "dau dau", "nhuc dau"]}
  FLUID: {name: "Ra nước âm đạo", meaning: "nước hoặc dịch (trong, đục) chảy / rỉ ra từ âm đạo, làm ướt quần – không phải nước tiểu (S1)", level: red,
          synonyms: ["ra nước", "ướt quần", "rỉ ối", "vỡ ối", "ra nuoc", "uot quan", "ri oi", "vo oi", "rỉ nước", "ri nuoc", "vỡ nước ối", "vo nuoc oi", "nước chảy ra âm đạo", "nuoc chay ra am dao"]}
  CONTRACTIONS: {name: "Gò bụng", meaning: "bụng (tử cung) căng cứng, co thắt, siết lại thành từng cơn, lặp lại (S3)", level: red, red_only_before_term: true,
                 synonyms: ["gò bụng", "cứng bụng", "bụng thắt", "bụng gò", "gò cứng", "go bung", "cung bung", "bung that", "bung go", "go cung"]}
  ABD_PAIN: {name: "Đau bụng", meaning: "đau, tức, quặn, âm ỉ, nhói ở bụng – ngoài vùng bụng trên giữa (S1)", level: yellow, level_if_severe: red,
             synonyms: ["đau bụng", "dau bung", "đau quặn", "dau quan"],
             severe_words: ["nhiều", "dữ dội", "quặn", "không chịu nổi", "nhieu", "du doi", "khong chiu noi"]}
  DYSPNEA: {name: "Khó thở", meaning: "khó thở, thở nhanh, thở dốc, hụt hơi, không đủ hơi, nặng hoặc đau ngực khi thở (S1, S2)", level: red,
            synonyms: ["khó thở", "thở không nổi", "hụt hơi", "kho tho", "tho khong noi", "hut hoi", "thở nhanh", "tho nhanh", "thở dốc", "tho doc", "thở gấp", "tho gap"]}
  CALF: {name: "Đau sưng một bên bắp chân", meaning: "MỘT bên chân (bắp chân, cẳng chân, đùi) sưng, đau, đỏ hoặc nóng hơn bên kia (S1, S2)", level: red,
         synonyms: ["bắp chân", "sưng một bên chân", "bap chan", "sung mot ben chan", "chân sưng đỏ", "chan sung do", "sưng đỏ một bên chân", "sung do mot ben chan"]}
  FACE_EDEMA: {name: "Phù mặt / tay", meaning: "phù / sưng mặt, mí mắt, bàn tay, ngón tay (S1, S2, S4)", level: yellow,
               synonyms: ["mặt sưng", "sưng mặt", "nhẫn chật", "phù mặt", "phù tay", "sưng tay", "mat sung", "sung mat", "nhan chat", "phu mat", "phu tay", "sưng mí mắt", "sung mi mat", "mí mắt sưng", "mi mat sung"]}
  FEVER: {name: "Sốt", meaning: "sốt: người nóng, hâm hấp, ớn lạnh / run, nhiệt độ từ 38°C (S1, S2)", level: yellow,
          synonyms: ["sốt", "người nóng", "sot", "nguoi nong"]}
  DYSURIA: {name: "Tiểu buốt", meaning: "đau, rát, buốt, xót khi đi tiểu; mót tiểu, tiểu nhiều lần (S1)", level: yellow,
            synonyms: ["tiểu buốt", "tiểu rắt", "tieu buot", "tieu rat"]}
  ITCH: {name: "Ngứa lòng bàn tay/chân", meaning: "ngứa nhiều, nhất là lòng bàn tay, bàn chân, thường không nổi mẩn", level: yellow,
         synonyms: ["ngứa tay chân", "ngứa lòng bàn tay", "ngứa lòng bàn chân", "ngua tay chan", "ngua long ban"]}
  HYPEREMESIS: {name: "Nghén nặng", meaning: "nôn / ói nhiều, không giữ được thức ăn hoặc nước uống (S2)", level: yellow,
                synonyms: ["nôn nhiều", "không ăn uống được", "nghén nặng", "non nhieu", "khong an uong duoc", "nghen nang", "ói nhiều", "oi nhieu", "nôn liên tục", "non lien tuc", "nôn ói nhiều", "non oi nhieu"]}
  SELF_HARM: {name: "Ý nghĩ tự hại", meaning: "ý nghĩ tự hại hoặc không muốn sống – kể cả nói gián tiếp, sống vô nghĩa, muốn kết thúc (S1, S2)", level: red, locked: true, negation_allowed: false, past_counts_yellow: true,
              synonyms: ["muốn biến mất", "không muốn sống", "muốn chết", "tự tử", "chẳng thiết sống", "không thiết sống",
                         "tự làm hại", "ngủ luôn không dậy", "tốt hơn nếu không có em", "tốt hơn nếu không có mình",
                         "muon bien mat", "khong muon song", "muon chet", "tu tu", "khong thiet song"]}

# Phương án A (người dùng chốt 11/11/2026): khi lớp danh mục CHẮC CHẮN triệu chứng là của người khác / đã hết,
# hoặc câu chỉ tả bé đạp bình thường, mà LLM vẫn ra ĐỎ → hạ finding đó còn tối đa cap_level (không bao giờ về xanh).
# Không áp dụng cho khái niệm locked (SELF_HARM). Không đụng luật khóa combine (mức quy tắc form vẫn giữ nguyên).
# [CẦN XÁC NHẬN] bác sĩ duyệt danh sách cụm từ.
form_cap:
  enabled: true
  cap_level: yellow
  # Có các cụm này → thai phụ có thể cũng bị / đang kể lại triệu chứng của mình → không hạ.
  keep_red_markers: ["em cũng", "cả em", "mình cũng", "tôi cũng", "giống em", "bảo em", "nói em", "thấy em",
                     "em cung", "ca em", "minh cung", "toi cung", "giong em", "bao em", "noi em", "thay em"]
  # Câu tả bé đạp bình thường; chỉ dùng để hạ REDUCED_FM / CONTRACTIONS khi danh mục không thấy khái niệm đó.
  normal_fm_concepts: [REDUCED_FM, CONTRACTIONS]
  normal_fm_phrases: ["đạp nhiều", "đạp đều", "đạp mạnh", "đạp liên tục", "đạp bình thường", "máy đều", "máy nhiều",
                      "dap nhieu", "dap deu", "dap manh", "dap lien tuc", "dap binh thuong", "may deu", "may nhieu"]
  # Mối lo ngoài danh mục bị bỏ nếu chỉ là câu bình thường: cụm "bình thường" chiếm gần hết mối lo
  # (còn lại tối đa max_leftover_tokens từ), hoặc mệnh đề gốc là đọc/nghe thông tin chứ không phải triệu chứng.
  # Mệnh đề có các từ này (diễn biến thay đổi / giảm) → không coi là "bé đạp bình thường".
  normal_fm_breakers: ["rồi", "nhưng", "sau đó", "tự nhiên", "bỗng", "giờ", "ít", "giảm", "yếu", "im", "không", "chưa",
                       "roi", "nhung", "sau do", "tu nhien", "bong", "gio", "giam", "yeu", "khong", "chua"]
  benign_concern_phrases: ["đạp nhiều", "đạp đều", "đạp mạnh", "đạp liên tục", "đạp bình thường", "khỏi rồi",
                           "đỡ rồi", "hết rồi", "vẫn khỏe", "vẫn bình thường", "dap nhieu", "dap deu", "dap manh",
                           "dap lien tuc", "khoi roi", "do roi", "het roi", "van khoe", "van binh thuong"]
  max_leftover_tokens: 1
  info_context_phrases: ["đọc trên mạng", "trên mạng", "đọc báo", "xem trên mạng", "doc tren mang", "tren mang",
                         "doc bao"]

noshow:
  call_threshold: 0.5
  sms_threshold: 0.3
  priority_windows:
    - {label: "sàng lọc 11-13+6", ga_from: [11, 0], ga_to: [13, 6], keywords: ["độ mờ da gáy", "NT", "double test", "sàng lọc"]}
    - {label: "nghiệm pháp đường huyết 24-28", ga_from: [24, 0], ga_to: [28, 0], keywords: ["nghiệm pháp", "NPDN"]}
    - {label: "liên cầu B 35-37", ga_from: [35, 0], ga_to: [37, 0], keywords: ["liên cầu"]}

llm:
  provider: ollama                         # ollama | mock | openai (openai: CHỈ dữ liệu giả, SYNTHETIC_DATA_ONLY=1)
  model: "qwen2.5:3b-instruct"
  openai_model: "gpt-4.1-mini"             # OPENAI_MODEL trong .env ưu tiên hơn
  consistency_runs_note: 5
  consistency_runs_form: 3
  temperature: 0.7
  economy_mode: true
  summary_llm_rewrite: false
  assertion_conflict_penalty: 0.2
  timeout_seconds: 120

channels:
  sms: excel                               # excel | mock | test_api
  alert: mock                              # mock | teams_webhook
