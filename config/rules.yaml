  arrival.merge_conflict_minutes: {group: arrival, editable: true, requires_doctor: false, basis: "docs/04 A2"}
  arrival.early_by_service: {group: arrival, editable: true, requires_doctor: false, basis: "Quy trình siêu âm"}
  arrival.call_note_keywords: {group: arrival, editable: true, requires_doctor: false, basis: "docs/04 A5"}
  arrival.fasting_keywords: {group: arrival, editable: true, requires_doctor: false, basis: "docs/04 A2"}
  arrival.late_ga_weeks: {group: arrival, editable: true, requires_doctor: true, basis: "Thai đủ tháng"}
  arrival.ai_confidence_min: {group: arrival, editable: true, requires_doctor: false, basis: "docs/05 mục 2"}
  arrival.waiting_slot: {group: arrival, editable: true, requires_doctor: false, basis: "Quy trình khám chờ của khoa"}
  forms.min_gap_days: {group: forms, editable: true, requires_doctor: false, basis: "docs/04 B"}
  forms.skip_if_visit_within_days: {group: forms, editable: true, requires_doctor: false, basis: "docs/04 B"}
  forms.stop_routine_from_ga_weeks: {group: forms, editable: true, requires_doctor: true, basis: "Lịch khám thai"}
  forms.resend_block_days: {group: forms, editable: true, requires_doctor: false, basis: "docs/04 B"}
  forms.token_ttl_days: {group: forms, editable: true, requires_doctor: false, basis: "docs/04 B"}
  forms.windows: {group: forms, editable: true, requires_doctor: true, basis: "Mốc khám thai định kỳ"}
  forms.modules: {group: forms, editable: true, requires_doctor: true, basis: "Theo dõi bệnh lý"}
  forms.unsure_level: {group: forms, editable: true, requires_doctor: true, basis: "Ngân hàng câu hỏi 0.9: Không chắc ≠ Không"}
  personalization.selection: {group: forms, editable: true, requires_doctor: true, basis: "Chọn câu cá nhân hóa (docs/13)"}
  personalization.ai_context: {group: forms, editable: true, requires_doctor: true, basis: "Tóm tắt lâm sàng gửi AI chọn câu (docs/13)"}
  personalization.concept_questions: {group: forms, editable: true, requires_doctor: true, basis: "Hỏi lại theo phần tự viết (docs/13)"}
  personalization.flag_targets: {group: forms, editable: true, requires_doctor: true, basis: "Cá nhân hóa bộ câu hỏi (docs/12)"}
  forms.postpartum_days: {group: forms, editable: true, requires_doctor: true, basis: "Chăm sóc sau sinh"}
  thresholds.bp_yellow: {group: thresholds, editable: true, requires_doctor: true, basis: "Tăng huyết áp thai kỳ"}
  thresholds.bp_red: {group: thresholds, editable: true, requires_doctor: true, basis: "THA nặng"}
