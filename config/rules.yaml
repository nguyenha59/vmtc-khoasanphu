# Ca đỏ bị điều dưỡng hạ mức (hạ vàng / báo nhầm) → danh sách bác sĩ xem lại trong ngày (docs/04 C6).
# [CẦN XÁC NHẬN] khoa duyệt. Bắt đầu 100%; giảm khi màn "Học từ kết quả gọi" cho thấy điều dưỡng hạ đúng.
alert_review:
  downgrade_sample_rate: 1.0               # 1.0 = xem tất cả; 0.2 = xem 1/5 (lấy mẫu ổn định theo mã cảnh báo)
