# Cấu hình mặc định – MVP. Ngưỡng y khoa phải được bác sĩ duyệt trước khi dùng thật.
rules_version: "0.23.0"

departments_included: ["Phòng khám Sản phụ khoa"]   # [CẦN XÁC NHẬN tên khoa trong file HIS]
# Chỉ xếp lịch thai kỳ + phụ khoa (người dùng chốt 17/11/2026). File OH không có cột khoa → dòng có ghi chú thuộc
# dịch vụ khoa khác bị BỎ khỏi lịch hẹn (như dòng khác khoa), TRỪ khi ghi chú có tuần thai / nói về thai kỳ
# (vd "thai IVF 20w" vẫn là khám thai). So không dấu, nguyên từ. Khách có nhiều lịch: bỏ dòng khoa khác trước khi gộp.
scope:
  # Rà soát 18/11/2026: CHỈ bỏ dòng có thủ thuật hỗ trợ sinh sản rõ ràng; từ chung chung (IVF, hiếm muộn…) → giữ lịch
  # + Cần xác nhận (SCOPE_CHECK) – tránh bỏ sót thai IVF đang ra máu.
  exclude_keywords: ["IUI", "ICSI", "bơm tinh trùng", "chuyển phôi", "trữ phôi", "trữ đông phôi", "chọc hút trứng",
                     "kích trứng", "kích thích buồng trứng", "tinh dịch đồ", "nam khoa", "trữ trứng"]
  check_keywords: ["IVF", "thụ tinh ống nghiệm", "thụ tinh nhân tạo", "hiếm muộn", "vô sinh", "hỗ trợ sinh sản"]
  keep_if_urgent_keywords: ["ra máu", "ra huyết", "ra nước", "rỉ ối", "đau bụng", "chuyển dạ"]
  keep_if_pregnancy_keywords: ["thai", "bầu", "mang thai", "khám thai", "sau sinh", "tkss", "hậu sản", "chuyển dạ"]
  # Ghi chú phụ khoa chỉ nhắc tiền sử hiếm muộn / IVF vẫn giữ (rà soát 18/11/2026).
  keep_if_gyn_keywords: ["tiền sử", "ts", "phụ khoa", "khí hư", "viêm", "u xơ", "u buồng trứng", "kinh nguyệt",
                         "rong kinh", "pap", "hpv", "soi tươi", "ngứa", "đau bụng"]

clinic:
  name: "Phòng khám Sản phụ khoa"
  hotline: "1900 0000"                      # [CẦN XÁC NHẬN số đường dây khoa]
  emergency_number: "115"

arrival:
  valid_hours: {from: "06:00", to: "20:00"}
  earliest_arrival: "06:30"
  # Phòng khám Sản – Vinmec Times City (người dùng chốt 17/11/2026). Giờ làm việc (vinmec.com/huong-dan-khach-hang/
  # gio-lam-viec-tai-cac-benh-vien-da-khoa-quoc-te-vinmec): T2–T6 08:00–12:00, 13:00–17:00; T7 08:00–12:00; CN nghỉ.
  # File OH: giờ đến sớm nhất = giờ mở cửa − 15' tiếp đón (Vinmec: đến trước 10–15'). Giờ TÍNH RA sớm hơn → đẩy về
  # mức này + Cần xác nhận (OPEN_TIME); giờ BÁC SĨ GHI sớm hơn → giữ giờ bác sĩ + Cần xác nhận.
  clinic_hours: {open: "08:00", close: "17:00", saturday_close: "12:00", sunday: closed}
  clinic_earliest_arrival: "07:45"
  # Giờ tính ra sớm hơn mức trên ≤ số phút này → tự đẩy về, không cần xác nhận. 0 = luôn cần xác nhận
  # (người dùng chốt 17/11/2026: "8h làm thì cần xác nhận chứ").
  clinic_open_review_gap: 0
  # Giờ bác sĩ ghi ít hơn (tiếp đón + tối thiểu các dịch vụ) từ số phút này trở lên → Cần xác nhận; ít hơn → theo
  # giờ bác sĩ (người dùng chốt 17/11/2026: "ít hơn 15' thì theo giờ bác sĩ").
  doctor_time_short_review: 15
  # Nghi chuyển dạ / dấu hiệu cấp cứu (visit_services.yaml visit_flow.urgent_*) → Cần xác nhận + lời dặn này.
  urgent_advice: "⚠ Nếu khách đang đau bụng từng cơn, ra máu hoặc ra nước → vào cấp cứu sản ngay, không chờ giờ hẹn"
  # Ưu tiên ghi chú bác sĩ; chỉ mâu thuẫn lớn mới Cần xác nhận (người dùng chốt 17/11/2026). Dịch vụ suy ra
  # (ghi chú không ghi) và khám thai thiếu tuần thai chỉ hiện thông tin, không bắt xác nhận.
  review_inferred_services: false
  review_missing_ga: false
  max_minutes_early: 90
  ai_rule_diff_minutes: 15
  merge_conflict_minutes: 180
  # Đến sớm theo từng lịch: xét nghiệm 30', siêu âm 20', khám / dịch vụ khác 15' – người dùng ƯỚC LƯỢNG ban đầu
  # 12/11/2026, KHÔNG phải khoa xác nhận. File OH (từ 17/11/2026): AI ước lượng theo nguồn (config/visit_services.yaml),
  # bảng này chỉ còn dùng cho lịch có cột Dịch vụ (dữ liệu giả dạng cũ).
  # Mỗi lịch trong ngày tính riêng (giờ hẹn − số phút của lịch đó), lấy giờ sớm nhất.
  # in_note: true → từ khóa cũng được dò trong ghi chú của lịch (bác sĩ dặn làm XN).
  early_by_service:                       # editable, requires_doctor: false
    - {keywords: ["xét nghiệm", "XN", "lấy máu", "nhịn ăn", "nghiệm pháp", "NPDN", "đường huyết"], minutes: 30, in_note: true}
    - {keywords: ["siêu âm", "SA", "2D", "4D", "hình thái", "doppler", "độ mờ da gáy", "NT"], minutes: 20}
    - {keywords: ["*"], minutes: 15}
  call_note_keywords: ["gọi", "xác nhận", "hỏi lại", "chưa rõ", "đổi lịch", "dời lịch", "?"]
  fasting_keywords: ["nhịn ăn", "nghiệm pháp", "NPDN", "đường huyết", "xét nghiệm máu", "lấy máu"]   # [CẦN XÁC NHẬN]
  late_ga_weeks: 37   # người dùng chốt 17/11/2026: từ 37 tuần (thai đủ tháng) → Cần xác nhận
  # Thai ≥ late_ga_weeks LUÔN cần xác nhận lại, kể cả khi bác sĩ đã ghi giờ đến (người dùng chốt 17/11/2026:
  # "37 tuần mà có giờ ghi bác sĩ vẫn cần xác nhận lại"). true = bỏ qua khi có giờ bác sĩ ghi.
  late_ga_skip_if_doctor_time: false
  # Chỉ gọi AI cho ghi chú mà quy tắc chưa hiểu hết (khoa chọn 12/11/2026). Ghi chú chỉ gồm các từ dưới đây
  # (so không dấu) + tuần thai / giờ / số phút → quy tắc đã đọc đủ, không gọi AI. Có từ lạ (vd "song thai",
  # "VMC cũ", "dọa sinh non") → vẫn gọi AI. Thêm từ vào đây = bớt gọi AI; thiếu từ chỉ làm gọi AI thừa (an toàn).
  ai_skip_vocabulary: [autobooking, thai, moi, ycbs, yc, bs, bac, si, kham, sieu, am, sa, xn, xet, nghiem, lay,
                       mau, nhin, an, npdn, nghiem, phap, den, toi, truoc, som, luc, co, mat, vao, phut, ph, p,
                       tieng, gio, h, g, ruoi, nua, mot, khoang, w, tuan, ngay, d, va, lam, de, dinh, ky, tai,
                       tk, tt, tuoi, hinh, theo, hen, dan, lich, doppler, phu, khoa, dk, 2d, 4d, nt, kq]
  ai_confidence_min: 0.8
  # File OH không có cột Dịch vụ → AI đọc MỌI ghi chú để suy ra loại khám + dịch vụ (người dùng chốt 17/11/2026);
  # ai_skip_vocabulary chỉ còn dùng khi đặt false.
  ai_read_all_notes: true
  # Tối ưu tốc độ (người dùng 17/11/2026): quy tắc đã đọc rõ ghi chú (loại khám + dịch vụ / giờ bác sĩ ghi) → không
  # gọi AI. AI chỉ đọc ghi chú mơ hồ.
  ai_skip_when_rules_clear: true
  # Ghi chú có viết tắt "Đang đoán" (danh mục tri thức, sheet Viết tắt) → Cần xác nhận cho tới khi khoa xác nhận nghĩa.
  review_guessed_abbr: true
  # Lịch hẹn trong khung này là "khám chờ" (giờ trên HIS không phải giờ thật) – khoa xác nhận 10/11/2026.
  # Không tính giờ đến; tin nhắn ghi nhãn thay cho giờ. Khung [from, to): 12:00 ≤ giờ hẹn < 13:00.
  waiting_slot: {from: "12:00", to: "13:00", label: "Khám chờ", mixed_review_minutes: 30}
  # Khám chờ là lịch sớm nhất nhưng khách còn lịch giờ thật muộn hơn "to" quá mixed_review_minutes
  # (vd khám chờ 12:00 + siêu âm 14:00) → giữ nhãn "Khám chờ", đưa vào Cần xác nhận (khoa 12/11/2026).   # [CẦN XÁC NHẬN lịch đúng 13:00 có phải khám chờ]

# Nội dung nhạy cảm trong ghi chú (12/11/2026). Gặp → hiện cảnh báo cho điều dưỡng (không trao đổi với
# người nhà, không ghi vào tin nhắn) và KHÔNG gửi ghi chú đó ra API bên ngoài (openai). So cả dạng không dấu.
# [CẦN XÁC NHẬN] khoa duyệt danh mục.
privacy:
  sensitive_topics:
    - {label: "Bệnh lây truyền", keywords: ["HIV", "giang mai", "lậu", "sùi mào gà", "viêm gan B", "viêm gan C",
                                             "HBsAg dương tính", "herpes sinh dục"]}
    - {label: "Đình chỉ / phá thai", keywords: ["đình chỉ thai", "phá thai", "hút thai", "bỏ thai",
                                                 "không giữ thai", "nạo thai"]}
    - {label: "Hỗ trợ sinh sản", keywords: ["IVF", "thụ tinh ống nghiệm", "mang thai hộ", "xin trứng",
                                             "xin tinh trùng", "IUI"]}
    - {label: "Bạo lực / xâm hại", keywords: ["bạo lực", "bị đánh", "chồng đánh", "xâm hại", "hiếp", "cưỡng bức"]}
    - {label: "Sức khỏe tâm thần", keywords: ["trầm cảm", "tự tử", "tự sát", "tâm thần", "rối loạn lo âu",
                                               "muốn chết"]}
    - {label: "Chất gây nghiện", keywords: ["ma túy", "nghiện", "cai nghiện", "methadone"]}
    - {label: "Yêu cầu giữ kín", keywords: ["giữ bí mật", "không muốn chồng biết", "không cho chồng biết",
                                             "giấu gia đình", "không báo người nhà", "giấu chồng", "bảo mật"]}
  # Câu giống LỆNH điều khiển máy trong phần thai phụ tự viết (prompt injection, rà soát bảo mật 20/11/2026).
  # Gặp → không cho AI hạ mức (ai_override) ở form đó + chuyển người xem. Không đổi mức của quy tắc (chỉ thêm xem lại).
  # Biểu thức chính quy, so trên chữ KHÔNG DẤU, chữ thường. Chỉ mẫu đặc trưng, tránh câu đời thường ("bỏ qua bữa sáng").
  prompt_injection:
    enabled: true
    patterns:
      - '\b(bo qua|phot lo|lo di|quen di|khong can theo)\b.{0,25}\b(huong dan|chi dan|lenh|quy tac|luat|chi thi|yeu cau tren|prompt)\b'
      - '\b(ignore|disregard|forget|override)\b.{0,25}\b(instruction|instructions|rule|rules|prompt|above|previous)\b'
      - '\b(system prompt|developer message|jailbreak|you are now|act as)\b'
      - '\b(ban la|may la|hay dong vai)\b.{0,15}\b(ai|tro ly|chatbot|mo hinh|gpt|he thong)\b'
      - '\b(tra ve|xuat ra|in ra|output|return)\b.{0,20}\b(json|findings|unmapped|xanh|green|khong co trieu chung|khong co phat hien)\b'
      - '\b(danh gia|xep|cham|phan loai)\b.{0,15}\b(la |muc )?(xanh|green)\b'
      - '\b(dung|khong duoc|dung co|dung bao)\b.{0,10}\b(canh bao|bao dong|alert)\b.{0,15}\b(ai|ai ca|bac si|khoa)\b'
      - '(<<<|>>>|```|\{\s*"findings"|"concept"\s*:|\bassistant\s*:|\bsystem\s*:|\buser\s*:)'

forms:
  # Ai được theo dõi từ xa (gửi form): package_only = chỉ khách theo gói thai sản + ca bác sĩ chỉ định ngoài gói
  # (người dùng chọn 12/11/2026). Tắt (false) = mọi thai phụ đã đồng ý.
  eligibility: {package_only: true}
  min_gap_days: 14
  skip_if_visit_within_days: 3
  skip_if_visited_within_days: 3          # vừa khám ≤ N ngày → không gửi (mọi loại form, trừ sau sinh) – docs/13
  stop_routine_from_ga_weeks: 36
  resend_block_days: 7
  resend_routine: false                    # docs/13: mỗi mốc gửi 1 lần (+ nhắc 1 lần), không gửi lại trong cửa sổ
  token_ttl_days: 3
  windows:                                # tuần thai (tuần, ngày)
    F1: {from: [8, 0], to: [10, 6]}
    F2: {from: [14, 0], to: [16, 6]}
    F3: {from: [19, 0], to: [21, 6]}
    F4: {from: [24, 0], to: [26, 6]}
    F5: {from: [29, 0], to: [31, 6]}
    F6: {from: [33, 0], to: [35, 6]}
  # Module bệnh lý gửi vào NGÀY CỐ ĐỊNH trong tuần (0 = Thứ 2 … 6 = Chủ nhật) – docs/13 (13/11/2026).
  # Tách tần suất ĐO (bác sĩ dặn, có thể hằng ngày, ghi sổ) và tần suất GỬI FORM báo cáo.
  # [CẦN XÁC NHẬN] bác sĩ duyệt. Tham chiếu: NICE NG133 (THA thai kỳ 1–2 lần/tuần; tiền sản giật ≥ mỗi 48 giờ), NICE NG3.
  modules:
    M-THA: {weekdays: [0, 3], weekdays_if_flag: {PREECLAMPSIA: [0, 2, 4]}}
    M-DTD: {weekdays: [0], weekdays_if_insulin: [0, 3]}
    # Bộ câu hỏi theo tình trạng: KHÔNG gửi SMS riêng, chỉ ghép vào form mốc trong cửa sổ tuần thai ga_from–ga_to;
    # riêng khi 2 lần khám cách nhau > packs.mid_gap_days → 1 form giữa khoảng. [CẦN XÁC NHẬN] bác sĩ duyệt.
    P-SINHNON: {ga_from: [22, 0], ga_to: [36, 6]}
    P-VETMO: {ga_from: [28, 0], ga_to: [39, 6]}
    P-TSG: {ga_from: [20, 0], ga_to: [39, 6]}
    P-TIEUNIEU: {ga_from: [4, 0], ga_to: [39, 6]}
  packs: {standalone: false, mid_gap_days: 28}
  # Thai phụ trả lời "Không chắc" cho câu triệu chứng → mức này (không bao giờ coi là Không / xanh).
  # [CẦN XÁC NHẬN] bác sĩ duyệt. Ngân hàng câu hỏi 0.9: "Không chắc / không trả lời ≠ Không".
  unsure_level: yellow
  postpartum_days: {S1: 3, S2: 7, S3: 14, S4: 42}
  postpartum_grace_days: 2                 # quên xuất SMS đúng ngày → vẫn gửi bù thêm N ngày (docs/04 C7)
  no_reply_reminder_hours: 48
  # Form mốc / bộ theo tình trạng không trả lời sau khi đã nhắc → thai phụ có nguy cơ vào danh sách điều dưỡng gọi.
  no_reply_call_if_risk: true

# Cá nhân hóa bộ câu hỏi (13/11/2026): tình trạng của thai phụ → module / bộ câu hỏi đề xuất.
# Nguồn: chẩn đoán ICD-10 trong kết quả khám, nhóm nguy cơ trong hồ sơ, tiền sử (từ khóa), AI đọc ghi chú lịch hẹn.
# Hệ thống chỉ ĐỀ XUẤT – điều dưỡng xác nhận từng thai phụ (người dùng chốt 13/11/2026).
# [CẦN XÁC NHẬN] bác sĩ duyệt toàn bộ ánh xạ dưới đây.
personalization:
  flag_names:
    HTN: "Tăng huyết áp"
    PREECLAMPSIA: "Tiền sản giật (thai này)"
    PREV_PREECLAMPSIA: "Tiền sử tiền sản giật"
    GDM: "Đái tháo đường thai kỳ"
    TWINS: "Song thai / đa thai"
    PRETERM_RISK: "Nguy cơ sinh non"
    PREV_CSECTION: "Vết mổ cũ"
    UTI: "Nhiễm khuẩn tiết niệu"
    ANEMIA: "Thiếu máu"
  # nhóm nguy cơ → module / bộ câu hỏi. Danh sách rỗng = chưa có bộ câu đạt chất lượng (chờ ngân hàng câu hỏi, docs/12).
  flag_targets:
    HTN: [M-THA]
    PREECLAMPSIA: [M-THA, P-TSG]
    PREV_PREECLAMPSIA: [P-TSG]
    GDM: [M-DTD]
    TWINS: [P-SINHNON]
    PRETERM_RISK: [P-SINHNON]
    PREV_CSECTION: [P-VETMO]
    UTI: [P-TIEUNIEU]
    ANEMIA: []
  # mã nhóm nguy cơ trong hồ sơ (risk_summary) → nhóm
  risk_codes: {HTN: HTN, PREECLAMPSIA: PREECLAMPSIA, GDM: GDM, TWINS: TWINS, PRETERM: PRETERM_RISK,
               PRETERM_RISK: PRETERM_RISK, PREV_CSECTION: PREV_CSECTION}
  # tiền tố mã ICD-10 → nhóm (chẩn đoán của thai kỳ này)
  icd10_prefixes:
    O10: HTN
    O13: HTN
    O14: PREECLAMPSIA
    O11: PREECLAMPSIA
    O24.4: GDM
    O30: TWINS
    O60: PRETERM_RISK
    O34.2: PREV_CSECTION
    O23: UTI
    O99.0: ANEMIA
  # từ khóa trong tiền sử (bỏ dấu khi so) → nhóm. Câu có từ phủ định ngay sau / trước ("không", "chưa") bị bỏ qua.
  history_keywords:
    PREV_CSECTION: ["mổ lấy thai", "mổ đẻ", "vết mổ cũ", "sẹo mổ tử cung"]
    PREV_PREECLAMPSIA: ["tiền sản giật", "sản giật"]
    HTN: ["tăng huyết áp"]
    GDM: ["đái tháo đường"]
    PRETERM_RISK: ["sinh non", "dọa sinh non", "khâu vòng cổ tử cung", "hở eo"]
    UTI: ["viêm đường tiết niệu", "nhiễm khuẩn tiết niệu", "viêm bàng quang"]
    ANEMIA: ["thiếu máu"]
  negation_words: ["không", "chưa", "âm tính"]
  # Bộ câu theo tình trạng TỰ áp dụng (không cần điều dưỡng duyệt) khi căn cứ do bác sĩ ghi trong hồ sơ – docs/13 mục 4.
  # Căn cứ chỉ từ AI đọc ghi chú / từ khóa tiền sử → vẫn chờ điều dưỡng xác nhận. Module đo (M-…) luôn cần xác nhận 1 lần.
  auto_apply_sources: [icd10, risk]
  # AI đọc ghi chú lịch hẹn (risk_flags) → nhóm
  note_flags: {HTN: HTN, PREECLAMPSIA: PREECLAMPSIA, GDM: GDM, TWINS: TWINS, PRETERM_RISK: PRETERM_RISK,
               PREV_CSECTION: PREV_CSECTION}
  # Khái niệm AI đọc từ phần tự viết lần trước → câu hỏi lần sau (hỏi lại cho rõ). [CẦN XÁC NHẬN]
  concept_questions: {BLEEDING: C1, ABD_PAIN: C2, FLUID: C3, FEVER: C4, DYSURIA: C5, HEADACHE: C6, VISUAL: C6,
                      EPIGASTRIC: C6, FACE_EDEMA: C7, REDUCED_FM: C8, CONTRACTIONS: C9, DYSPNEA: DYSPNEA, CALF: CALF,
                      ITCH: ITCH, HYPEREMESIS: NAUSEA}
  # Chọn + xếp câu trong từng form (docs/13 mục 5c). Câu bắt buộc (form mốc, module, bộ theo tình trạng, câu hỏi lại)
  # KHÔNG BAO GIỜ bị bỏ; điểm chỉ quyết định thêm câu tùy chọn và thứ tự. AI chỉ được NÂNG điểm (lấy max với quy tắc).
  selection:
    max_questions: 15                      # trần cho câu tùy chọn thêm vào (câu bắt buộc không bị cắt)
    include_threshold: 0.6                 # câu tùy chọn có điểm ≥ ngưỡng mới được thêm
    rule_scores: {carry_over: 1.0, concept: 0.8, condition: 0.7, base: 0.1}
    recent_answer_days: 30                 # câu trả lời / phần tự viết trong N ngày gần nhất mới dùng để hỏi lại
    ai_runs: 3                             # AI chấm 3 lần, lấy trung vị (tự nhất quán)
    ai_runs_local: 1                       # AI trên máy (Ollama, xử lý từng yêu cầu) chấm 1 lần – tối ưu tốc độ gửi form
    ai_temperature: 0.3
    ai_max_spread: 0.3                     # điểm một câu lệch > 0.3 giữa các lần → bỏ điểm AI câu đó
    ai_min_confidence: 0.6                 # AI tự báo tin cậy < 0.6 → bỏ toàn bộ điểm AI, dùng quy tắc
    ai_add_threshold: 0.8                  # AI tự THÊM câu (quy tắc chưa chọn) chỉ khi điểm AI ≥ 0.8 – vùng sát ngưỡng dễ dao động
  # Tóm tắt lâm sàng ĐÃ PHÂN LOẠI gửi kèm cho AI chọn câu (người dùng chọn 14/11/2026). Không gửi số đo gốc, ngày,
  # ghi chú tự do. Ngưỡng huyết áp / đường huyết dùng `thresholds`, xu hướng dùng `trends`. [CẦN XÁC NHẬN] bác sĩ duyệt.
  ai_context:
    fields: [measurements, medications, obstetric_history, visit_gap]   # bỏ bớt mục để ngừng gửi nhóm đó
    measurement_days: 14                   # chỉ dùng số đo trong 14 ngày gần nhất
    lab_kinds: {GLU_FAST: glu_fast, OGTT_0: glu_fast, OGTT_1: glu_1h, OGTT_2: glu_2h}   # xét nghiệm tại khoa (mmol/L) → loại số đo
    # HIS chưa có danh sách thuốc → dò từ khóa trong phần xử trí của lần khám gần nhất (+ trường insulin có cấu trúc)
    medication_keywords:
      ANTIHYPERTENSIVE: ["thuốc hạ áp", "methyldopa", "nifedipin", "labetalol"]
      ASPIRIN: ["aspirin"]
      IRON: ["bổ sung sắt", "viên sắt"]
      PROGESTERONE: ["progesteron"]
    medication_names:
      INSULIN: "Đang dùng insulin"
      ANTIHYPERTENSIVE: "Đang dùng thuốc hạ áp"
      ASPIRIN: "Đang dùng aspirin liều thấp"
      IRON: "Đang bổ sung sắt"
      PROGESTERONE: "Đang dùng progesteron"
    obstetric_keywords:                    # tiền sử sản khoa (các lần mang thai trước) – chỉ gửi mục CÓ
      PREV_PRETERM: ["sinh non"]
      PREV_MISCARRIAGE: ["sẩy thai"]
      PREV_STILLBIRTH: ["thai lưu"]
      PREV_CSECTION: ["mổ lấy thai", "mổ đẻ"]
      PREV_PREECLAMPSIA: ["tiền sản giật", "sản giật"]
      PREV_PPH: ["băng huyết"]
      NULLIPARA: ["con so"]
    obstetric_names:
      PREV_PRETERM: "Tiền sử sinh non"
      PREV_MISCARRIAGE: "Tiền sử sẩy thai"
      PREV_STILLBIRTH: "Tiền sử thai lưu"
      PREV_CSECTION: "Tiền sử mổ lấy thai"
      PREV_PREECLAMPSIA: "Tiền sử tiền sản giật"
      PREV_PPH: "Tiền sử băng huyết sau sinh"
      NULLIPARA: "Mang thai lần đầu (con so)"

thresholds:                               # requires_doctor: true
  bp_yellow: {sys: 140, dia: 90}
  bp_red: {sys: 160, dia: 110}
  glucose_yellow: {fasting: 5.3, after_1h: 7.8, after_2h: 6.7}   # mmol/L, QĐ 1470/QĐ-BYT
  epds_threshold: 12 # đề xuất 4 theo bản tiếng Việt (Tran và cs. 2011) – chờ duyệt
  epds_item10_red: {value: true, locked: true}
  implausible: {sys_min: 70, sys_max: 250, glu_min: 1, glu_max: 40}
  weight_jump_kg_per_week: null            # [CẦN XÁC NHẬN] khoa điền
  contractions_red_before_ga_weeks: 37
  contractions_level_at_term: yellow       # [CẦN XÁC NHẬN] gò bụng ≥ 37 tuần

trends:
  ewma_lambda: 0.3
  baseline_readings: 4
  sigma_k: 2
  consecutive_rises: 3
  min_rise_mmhg: 8
  min_readings: 3
  min_sigma: 3                             # sàn độ lệch chuẩn khi mức nền quá phẳng
  ewma_kinds: [bp_sys, bp_dia]

combine:
  ai_only_escalates: {value: true, locked: true}

# Phần tự viết: kết hợp triệu chứng → Đỏ, giống luật kết hợp của câu có cấu trúc (FEVER_PLUS, EDEMA_PLUS) và P01.
# any_of = chỉ cần 1 khái niệm trong nhóm. Chỉ NÂNG mức. [CẦN XÁC NHẬN] bác sĩ duyệt.
text_combos:
  - {code: TXT_EDEMA_HEADACHE, all: [FACE_EDEMA, HEADACHE], level: red, reason: "Phù mặt/tay kèm đau đầu (phần tự viết)", basis: [S4, S5]}
  - {code: TXT_HEADACHE_SIGNS, all: [HEADACHE], any_of: [VISUAL, EPIGASTRIC], level: red, reason: "Đau đầu kèm nhìn mờ / đau thượng vị (phần tự viết)", basis: [S1, S4]}
  - {code: TXT_FEVER_PLUS, all: [FEVER], any_of: [ABD_PAIN, FLUID], level: red, reason: "Sốt kèm đau bụng / ra nước (phần tự viết)", basis: [S1]}

# Căn cứ của từng mức ĐỎ – hiện ở mục "Vì sao ca này khẩn" (mọi cảnh báo đỏ phải chỉ ra được: dữ liệu nào → quy tắc nào → nguồn nào).
# Mã nguồn xem knowledge/sources/y-khoa.md mục 1. Khái niệm tự viết lấy nguồn từ "(S…)" cuối `meaning`.
