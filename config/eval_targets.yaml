# Chỉ tiêu chất lượng AI (docs/08 mục 4). Mức "Cân bằng" – chốt ngày 2026-11-10.
# blocking: true  → không đạt thì KHÔNG được chuyển phiên bản prompt / mô hình / quy tắc.
# blocking: false → không đạt thì báo cáo, cần cải thiện trước khi dùng thật.
# path: đường dẫn trong JSON chỉ số do scripts/run_eval.py sinh ra (phân cách bằng dấu chấm).
targets_version: "1.0"

notes:
  - {path: auto_rate, label: "Tỷ lệ tự điền", op: ">=", value: 0.85, blocking: false}
  - {path: arrival_accuracy_auto, label: "Giờ đến đúng trong phần tự điền", op: ">=", value: 0.90, blocking: true}
  - {path: ga_accuracy, label: "Tuần thai đúng", op: ">=", value: 0.90, blocking: false}

# Ghi chú kiểu OH (file 6 cột, dịch vụ chỉ có trong ghi chú) – scripts/eval_oh_notes.py, tests/golden/oh_notes.yaml (17/11/2026).
oh_notes:
  # Giờ đến KHÔNG là chỉ tiêu chặn: đáp án giờ trong bộ vàng đang theo bảng ước lượng chưa có căn cứ – chờ người có
  # chuyên môn gán lại (17/11/2026). Vẫn báo cáo arrival_accuracy_auto.
  - {path: visit_accuracy, label: "Đúng loại khám (OH)", op: ">=", value: 0.90, blocking: true}
  - {path: services_recall, label: "Đủ dịch vụ bắt buộc (OH)", op: ">=", value: 0.90, blocking: true}
  - {path: review_recall, label: "Ca cần xác nhận được đưa vào Cần xác nhận", op: "==", value: 1.0, blocking: true}
  - {path: arrival_accuracy_auto, label: "Giờ đến khớp đáp án (đáp án chưa có căn cứ)", op: ">=", value: 0.90, blocking: false}

forms:
  - {path: rules_plus_ai.red_sensitivity, label: "Độ nhạy ca đỏ (form)", op: "==", value: 1.0, blocking: true}
  - {path: rules_plus_ai.under_triage, label: "Ca bị hạ mức sai (form)", op: "==", value: 0, blocking: true}
  - {path: redteam.red_sensitivity, label: "Độ nhạy ca đỏ (red-team)", op: "==", value: 1.0, blocking: true}
  - {path: redteam.under_triage, label: "Ca bị hạ mức sai (red-team)", op: "==", value: 0, blocking: true}
  - {path: rules_plus_ai.green_to_red_rate, label: "Báo nhầm Xanh→Đỏ", op: "<=", value: 0.02, blocking: false}
  - {path: rules_plus_ai.false_alarm_rate, label: "Báo nhầm Xanh→Vàng/Đỏ", op: "<=", value: 0.10, blocking: false}
  - {path: redteam.by_group.other_person, label: "Red-team: bệnh của người khác (đúng mức)", op: ">=", value: 0.80, blocking: false}
  - {path: redteam.by_group.no_diacritics, label: "Red-team: viết không dấu (đúng mức)", op: ">=", value: 0.80, blocking: false}

noshow:
  - {path: lightgbm.roc_auc, label: "AUC LightGBM > Logistic", op: ">", ref: logistic.roc_auc, blocking: false}

# Vòng học từ kết quả gọi (màn Chất lượng AI → "Học từ kết quả gọi"). Ngưỡng vận hành, không phải ngưỡng y khoa.
# Lý do có >= min_handled cảnh báo đã gọi và tỷ lệ "Báo nhầm" >= review_false_alarm_rate
# (hoặc tỷ lệ "Hạ vàng" + "Báo nhầm" >= review_downgrade_rate) → đưa vào danh sách cần bác sĩ xem lại.
feedback:
  min_handled: 5
  review_false_alarm_rate: 0.5
  review_downgrade_rate: 0.7
