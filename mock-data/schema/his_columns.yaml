# Ánh xạ tên cột trong file xuất → trường chuẩn. Một trường có thể có nhiều tên cột (lấy tên đầu tiên có trong file).
# File OH THẬT (mentor xác nhận 17/11/2026) chỉ có 6 cột: HN, Patient Name, Appointment Start Date Time,
# Appointment Resource (tên bác sĩ), Appointment Comment, Mobile – KHÔNG có Dịch vụ / Khoa / Giờ kết thúc:
# dịch vụ suy ra từ ghi chú (config/visit_services.yaml, docs/04 A3).
# Tên cột kiểu cũ ("Mã BN", "Họ tên"…) chỉ còn để đọc bộ dữ liệu giả cũ trong tests/golden.
columns:
  "HN": pid
  "Patient Name": full_name
  "Mobile": phone
  "Appointment Start Date Time": appt_datetime
  "Appointment Resource": doctor
  "Appointment Comment": note
  # --- dạng cũ (dữ liệu giả cũ) ---
  "Mã BN": pid
  "Họ tên": full_name
  "Điện thoại": phone
  "Quốc tịch": nationality
  "Ngày hẹn": appt_date
  "Giờ bắt đầu": start_time
  "Giờ kết thúc": end_time
  "Dịch vụ": service
  "Khoa/Phòng": department
  "Bác sĩ": doctor
  "Ghi chú": note
  "Thời điểm đặt": booked_at
# "a|b" = cần ít nhất một trong các trường.
required: [pid, full_name, phone, "appt_datetime|appt_date", "appt_datetime|start_time", note]
date_format: "%d/%m/%Y"
time_format: "%H:%M"
# Khách tự đặt lịch → ghi chú bắt đầu bằng tiền tố này (khoa xác nhận 10/11/2026).
# File HIS không có cột "Nguồn đặt" (bỏ 12/11/2026): tiền tố được tách khỏi ghi chú khi đọc file và
# nguồn đặt = "Autobooking"; không có tiền tố = bác sĩ hẹn (để trống).
self_booking_prefixes: ["Autobooking"]
# Phần thông tin đặt lịch trong ghi chú khách tự đặt (không phải nội dung khám) – cắt bỏ trước khi đọc / gửi AI:
# kênh (DRP/MVM/OVM), cộng tác viên "CTV_<tên>_CTV001234", "ko tam ung", mã đơn "#123456". Regex, không phân biệt hoa thường.
# Người dùng xác nhận 17/11/2026: tên CTV làm bước che dữ liệu chặn gửi AI (PII_LEFT). [CẦN XÁC NHẬN nghĩa DRP/MVM/OVM]
booking_meta_patterns:
  - '^(DRP|MVM|OVM)[_\s]+'
  - 'CTV[_\s]+[^_#]*?[_\s]*CTV\d+[_\s]*'
  - 'ko\s+tam\s+ung[_\s]*'
  - '#\d+[_\s]*'


# Các cách ghi quốc tịch Việt Nam trong HIS (so không dấu, không phân biệt hoa thường) → file nhac_hen_VN.
# Quốc tịch trống cũng tính là Việt Nam.
vietnam_aliases: ["Việt Nam", "Vietnam", "Viet Nam", "VN", "VNM", "Vietnamese", "Người Việt"]

# File nhắc hẹn WorldSMS. Ý nghĩa P–P6 khoa xác nhận 12/11/2026.
# [CẦN XÁC NHẬN] tiêu đề cột SĐT và thứ tự cột theo file mẫu WorldSMS – chỉ cần sửa ở đây, không sửa code.
worldsms:
  columns:                     # thứ tự = thứ tự cột trong file; vế phải là trường dữ liệu
    - {header: "Số điện thoại", field: phone}
    - {header: "P", field: full_name}
    - {header: "P1", field: pid}
    - {header: "P2", field: start_time}
    - {header: "P3", field: day}
    - {header: "P4", field: month}
    - {header: "P5", field: year}
    - {header: "P6", field: arrival_time}
  phone_format: local          # local = 0912345678 · intl = 84912345678
