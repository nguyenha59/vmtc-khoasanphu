[project]
name = "tro-ly-thai-ky"
version = "0.1.0"
description = "MVP Trợ lý lịch hẹn & theo dõi thai kỳ – Phòng khám Sản phụ khoa (chỉ dữ liệu giả)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.1",
  "openpyxl>=3.1",
  "sqlalchemy>=2.0",
  "cryptography>=42",
  "pyyaml>=6",
  "ruamel.yaml>=0.18",
  "requests>=2.31",
  "jsonschema>=4.20",
  "underthesea>=6.8",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "shap>=0.45",
  "bcrypt>=4.1",
  "fpdf2>=2.7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7",  # openpyxl tự dùng khi có: chống bom XML trong file .xlsx tải lên
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6.100", "ruff>=0.5", "black>=24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI: Depends(...) trong tham số mặc định là cách viết chuẩn.
"api/**" = ["B008"]
